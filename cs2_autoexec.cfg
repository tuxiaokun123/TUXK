// =============================================================
// CS2 autoexec.cfg — 性能 / 网络 / 稳定性 优化配置
// 放置路径: Steam\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\autoexec.cfg
// 启动游戏会自动执行；首次可手动在控制台输入: exec autoexec
// 行首 // 为注释，可按需启用/关闭
// =============================================================

// -------------------- 性能 / FPS --------------------
fps_max 0                  // 0 = 解除 FPS 上限，吃满显卡 (竞技推荐)。如机器发热严重可设 0 上限的稳定值如 fps_max 400
fps_max_ui 120             // 主菜单/后台界面帧数上限，省资源降发热
engine_no_focus_sleep 0    // 切到后台时不降帧 (串流/录屏友好；纯打游戏可改 1 省电)
r_dynamic 0                // 关闭动态光照，提升稳定性与帧数
r_drawtracers_firstperson 0 // 关闭第一人称曳光弹，减少视觉干扰 + 小幅性能提升
cl_predict 1               // 客户端预测，降低移动顿挫
cl_predictweapons 1        // 武器预测

// -------------------- 网络 / 插值 (降低延迟) --------------------
rate 786432                // 最大带宽 (B/s)，对应 ~6 Mbps，局域网/高速宽带安全值
cl_interp 0                // 0 = 由 interp_ratio 自动计算
cl_interp_ratio 1          // 比例 1 = 最低插值延迟 (稳定连接推荐)。丢包率高可改 2
cl_lagcompensation 1       // 服务端延迟补偿，必开
cl_updaterate 128          // 上行 (受服务器限制，128 是上限)
cl_cmdrate 128             // 下行 (受服务器限制，128 是上限)
cl_smooth 0                // 关闭平滑，减少画面橡皮筋
cl_timeout 30              // 断线重连超时延长，避免短暂丢包被踢
mm_dedicated_search_maxping 70 // 官匹搜索最大延迟 (ms)，按地区调整，国内可 50~80

// -------------------- 画质性能平衡 (游戏内可再细调，此处为兜底) --------------------
mat_powersavingsmode 0     // 关闭省电模式 (如该 cvar 在你版本有效)
r_fullscreen_gamma 2.2     // 全屏伽马，画面更亮更易看人

// -------------------- 音频 (清晰听脚步) --------------------
volume 0.5                 // 主音量，按个人习惯
snd_menumusic_volume 0     // 关闭菜单音乐
snd_roundstart_volume 0    // 关闭回合开始音乐
snd_roundend_volume 0      // 关闭回合结束音乐
snd_mapobjective_volume 0  // 关闭目标音乐
snd_tensecondwarning_volume 0.06 // 10 秒炸弹倒计时 (保留一点点便于感知)
snd_mvp_volume 0           // 关闭 MVP 音乐
snd_deathcamera_volume 0   // 关闭死亡音乐
voice_scale 0.5            // 队友语音音量
snd_mixahead 0.025         // 音频缓冲 (秒)，降低可减少声音延迟，过低会爆音
snd_headphone_pan_exponent 2
snd_headphone_pan_radial_weight 2
snd_steamaudio_enable_perspective_correction 1 // SteamAudio 立体声修正

// -------------------- 操作 / HUD 体验 --------------------
cl_autowepswitch 0         // 拾取武器不自动切换，避免误操作
cl_use_opens_buy_menu 0    // E (使用) 不打开购买菜单
cl_showloadout 1           // 显示当前装备
cl_show_clan_tags 1        // 显示战队标签
cl_join_advertise 2        // 允许好友加入你的小队
cl_teammate_colors_overhead 1 // 队友头顶颜色
gameinstructor_enable 0    // 关闭教学提示
cl_dm_buyrandomweapons 0   // 死斗不随机发枪
option_duck_method 0       // 蹲下为按住 (推荐)
option_speed_method 0      // 行走为按住 (推荐)
con_enable 1               // 启用控制台 (如未在设置里开)
developer 0                // 关闭开发者信息刷屏

// -------------------- 视图模型 (默认，按个人喜好改) --------------------
viewmodel_presetpos 3      // 3 = 经典 (居中偏右)
viewmodel_fov 68           // 视图模型 FOV
cl_bob_lower_amt 5         // 减小武器晃动
cl_bobamt_lat 0.1
cl_bobamt_vert 0.1
cl_bobcycle 0.98

// -------------------- 雷达 (信息最大化) --------------------
cl_radar_always_centered 0 // 雷达不强制居中玩家，能看到更多边缘
cl_radar_scale 0.4         // 雷达缩放，看更大范围
cl_hud_radar_scale 1.15    // HUD 雷达大小
cl_radar_icon_scale_min 0.6
cl_radar_rotate 1
hud_scaling 0.85

// -------------------- 准星 (留作示例，建议用游戏内准星编辑器自定义并写入这里) --------------------
// 以下是经典静态绿点示例，按需修改:
cl_crosshairstyle 4
cl_crosshairsize 2
cl_crosshairthickness 1
cl_crosshairgap -2
cl_crosshair_drawoutline 1
cl_crosshair_outlinethickness 1
cl_crosshaircolor 1        // 1=绿
cl_crosshairalpha 255

// -------------------- 文末: 应用后清理 --------------------
host_writeconfig           // 将当前配置写入 config.cfg，防止被覆盖
echo "=== autoexec.cfg loaded ==="
